[package]
name = "rkdkcw-audio-studio"
version = "2.1.1"
description = "RKDKCW Audio Studio Native Desktop App"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "RKDKCW_Launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
